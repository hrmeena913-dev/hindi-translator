name: Build Hindi Translator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/hinditranslator
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HindiTranslator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.hinditranslator'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.hinditranslator'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.mlkit:translate:17.0.3'
              implementation 'com.google.mlkit:language-id:17.0.6'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="मेरा हिंदी अनुवाद"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TranslateService"
                      android:label="मेरा हिंदी अनुवाद"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/translator_service"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="service_description">हिंदी बटन दबाने पर सामने वाले ऐप का उपलब्ध पाठ पढ़कर फोन पर अनुवाद करता है। स्क्रीनशॉट नहीं लेता और पाठ सेव नहीं करता। अनुमति किसी भी समय बंद की जा सकती है।</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/translator_service.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:isAccessibilityTool="false"/>
          EOF

          cat > app/src/main/java/com/example/hinditranslator/MainActivity.java <<'EOF'
          package com.example.hinditranslator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.provider.Settings;
          import android.widget.*;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(28, 48, 28, 28);

                  TextView title = new TextView(this);
                  title.setText("मेरा हिंदी अनुवाद");
                  title.setTextSize(26);
                  box.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "\nयह ऐप Accessibility की अनुमति इस्तेमाल करता है।\n\n" +
                      "केवल हिंदी बटन दबाने पर सामने वाले ऐप का उपलब्ध पाठ पढ़ता है। " +
                      "पाठ सेव नहीं करता। अनुवाद फोन पर होता है। " +
                      "स्क्रीनशॉट नहीं लेता और पासवर्ड/लिखने वाले बॉक्स छोड़ देता है।\n\n" +
                      "पहली बार भाषा मॉडल डाउनलोड करने के लिए इंटरनेट चाहिए। " +
                      "मॉडल लगभग 30 MB के हो सकते हैं। सामान्यतः Wi-Fi इस्तेमाल होगा।\n\n" +
                      "फोटो, वीडियो और सुरक्षित स्क्रीन का पाठ नहीं पढ़ सकता। " +
                      "अनुवाद गलत भी हो सकता है। बैंकिंग या निजी जानकारी वाली स्क्रीन पर इस्तेमाल न करें।\n\n" +
                      "अनुमति चालू करने के बाद दूसरे ऐप में जाएँ और हिंदी बटन दबाएँ। " +
                      "बटन को खींचकर जगह बदल सकते हैं।\n\n" +
                      "अनुवाद: Google ML Kit\n"
                  );
                  info.setTextSize(16);
                  box.addView(info);

                  CheckBox consent = new CheckBox(this);
                  consent.setText("मैं समझता/समझती हूँ और स्क्रीन का पाठ पढ़ने की अनुमति देता/देती हूँ");
                  box.addView(consent);

                  CheckBox mobile = new CheckBox(this);
                  mobile.setText("मॉडल डाउनलोड के लिए मोबाइल डेटा भी इस्तेमाल करें");
                  mobile.setChecked(getSharedPreferences("prefs", 0)
                      .getBoolean("mobile", false));
                  box.addView(mobile);

                  Button enable = new Button(this);
                  enable.setText("सहमति देकर अनुमति खोलें");
                  enable.setOnClickListener(v -> {
                      if (!consent.isChecked()) {
                          Toast.makeText(this, "पहले सहमति पर टिक करें", Toast.LENGTH_LONG).show();
                          return;
                      }
                      getSharedPreferences("prefs", 0).edit()
                          .putBoolean("consent", true)
                          .putBoolean("mobile", mobile.isChecked()).apply();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  box.addView(enable);

                  Button disable = new Button(this);
                  disable.setText("अनुमति बंद करने की सेटिंग खोलें");
                  disable.setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  box.addView(disable);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(box);
                  setContentView(scroll);
              }
          }
          EOF

          cat > app/src/main/java/com/example/hinditranslator/TranslateService.java <<'EOF'
          package com.example.hinditranslator;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.PixelFormat;
          import android.graphics.Color;
          import android.view.*;
          import android.view.accessibility.*;
          import android.widget.*;
          import java.util.LinkedHashSet;
          import com.google.mlkit.common.model.DownloadConditions;
          import com.google.mlkit.nl.languageid.*;
          import com.google.mlkit.nl.translate.*;

          public class TranslateService extends AccessibilityService {
              private WindowManager wm;
              private Button bubble;
              private LinearLayout panel;
              private TextView result;
              private LanguageIdentifier identifier;
              private Translator translator;
              private int request = 0;
              private int nodes = 0;

              @Override
              protected void onServiceConnected() {
                  if (!getSharedPreferences("prefs", 0).getBoolean("consent", false)) {
                      disableSelf();
                      return;
                  }
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  identifier = LanguageIdentification.getClient();
                  showBubble();
              }

              private int dp(int n) {
                  return (int) (n * getResources().getDisplayMetrics().density);
              }

              private void showBubble() {
                  if (bubble != null) return;
                  bubble = new Button(this);
                  bubble.setText("हिंदी");
                  bubble.setContentDescription("सामने वाली स्क्रीन का हिंदी अनुवाद");
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                      dp(76), dp(58),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  p.gravity = Gravity.TOP | Gravity.LEFT;
                  p.x = Math.max(0, getResources().getDisplayMetrics().widthPixels - dp(80));
                  p.y = dp(220);
                  bubble.setOnClickListener(v -> translateScreen());
                  bubble.setOnTouchListener(new View.OnTouchListener() {
                      float startX, startY;
                      int oldX, oldY;
                      boolean moved;

                      @Override
                      public boolean onTouch(View view, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              startX = e.getRawX();
                              startY = e.getRawY();
                              oldX = p.x;
                              oldY = p.y;
                              moved = false;
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              int dx = (int) (e.getRawX() - startX);
                              int dy = (int) (e.getRawY() - startY);
                              if (Math.abs(dx) + Math.abs(dy) > dp(8)) moved = true;
                              if (moved) {
                                  p.x = Math.max(0, Math.min(
                                      getResources().getDisplayMetrics().widthPixels - dp(76), oldX + dx));
                                  p.y = Math.max(0, Math.min(
                                      getResources().getDisplayMetrics().heightPixels - dp(58), oldY + dy));
                                  wm.updateViewLayout(bubble, p);
                              }
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              if (!moved) view.performClick();
                              return true;
                          }
                          return true;
                      }
                  });
                  wm.addView(bubble, p);
              }

              private void collect(AccessibilityNodeInfo node,
                                   LinkedHashSet<String> lines, int depth) {
                  if (node == null || depth > 50 || ++nodes > 2500) return;
                  if (node.isPassword() || node.isEditable()) return;
                  if (node.isVisibleToUser() && node.getText() != null) {
                      String text = node.getText().toString().trim();
                      if (!text.isEmpty()) lines.add(text);
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          collect(child, lines, depth + 1);
                          child.recycle();
                      }
                  }
              }

              private void translateScreen() {
                  if (panel != null) return;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  LinkedHashSet<String> lines = new LinkedHashSet<>();
                  nodes = 0;
                  if (root != null) {
                      CharSequence pkg = root.getPackageName();
                      if (pkg == null || !getPackageName().contentEquals(pkg)) {
                          collect(root, lines, 0);
                      }
                      root.recycle();
                  }
                  StringBuilder text = new StringBuilder();
                  for (String line : lines) {
                      if (text.length() >= 4000) break;
                      int room = 4000 - text.length();
                      text.append(line.substring(0, Math.min(line.length(), room)));
                      if (text.length() < 4000) text.append('\n');
                  }
                  showPanel();
                  if (text.length() == 0) {
                      result.setText("इस स्क्रीन का पाठ उपलब्ध नहीं है। किसी लिखावट वाले पेज पर जाएँ। फोटो, वीडियो और सुरक्षित स्क्रीन समर्थित नहीं हैं।");
                      return;
                  }
                  final String input = text.toString();
                  final int token = ++request;
                  result.setText("भाषा पहचान रहे हैं…");
                  identifier.identifyLanguage(input)
                      .addOnSuccessListener(tag -> {
                          if (!active(token)) return;
                          if (tag == null || "und".equals(tag)) {
                              result.setText("भाषा स्पष्ट नहीं है। अधिक लिखावट वाला पेज खोलकर फिर कोशिश करें।");
                              return;
                          }
                          String source = TranslateLanguage.fromLanguageTag(tag);
                          if (source == null) {
                              result.setText("इस भाषा का अनुवाद अभी समर्थित नहीं है: " + tag);
                              return;
                          }
                          if (TranslateLanguage.HINDI.equals(source)) {
                              result.setText("यह पाठ पहले से हिंदी में है:\n\n" + input);
                              return;
                          }
                          if (translator != null) translator.close();
                          Translator local = Translation.getClient(
                              new TranslatorOptions.Builder()
                                  .setSourceLanguage(source)
                                  .setTargetLanguage(TranslateLanguage.HINDI)
                                  .build());
                          translator = local;
                          DownloadConditions.Builder conditions = new DownloadConditions.Builder();
                          boolean mobile = getSharedPreferences("prefs", 0)
                              .getBoolean("mobile", false);
                          if (!mobile) conditions.requireWifi();
                          result.setText("भाषा: " + tag +
                              "\nमॉडल तैयार हो रहा है। पहली बार डाउनलोड में समय लगेगा।" +
                              (mobile ? "" : "\nWi-Fi चालू रखें।"));
                          local.downloadModelIfNeeded(conditions.build())
                              .addOnSuccessListener(unused -> {
                                  if (!active(token)) return;
                                  result.setText("हिंदी अनुवाद हो रहा है…");
                                  local.translate(input)
                                      .addOnSuccessListener(output -> {
                                          if (active(token)) result.setText(output);
                                      })
                                      .addOnFailureListener(error -> {
                                          if (active(token)) result.setText("अनुवाद नहीं हो पाया। फिर कोशिश करें।");
                                      });
                              })
                              .addOnFailureListener(error -> {
                                  if (active(token)) result.setText(
                                      "मॉडल डाउनलोड नहीं हुआ। इंटरनेट, Wi-Fi और खाली स्टोरेज जाँचें।");
                              });
                      })
                      .addOnFailureListener(error -> {
                          if (active(token)) result.setText("भाषा पहचान नहीं हो पाई। फिर कोशिश करें।");
                      });
              }

              private boolean active(int token) {
                  return panel != null && token == request;
              }

              private void showPanel() {
                  bubble.setVisibility(View.GONE);
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(16), dp(16), dp(16), dp(12));
                  panel.setBackgroundColor(Color.WHITE);

                  TextView heading = new TextView(this);
                  heading.setText("हिंदी अनुवाद • Google ML Kit");
                  heading.setTextSize(20);
                  heading.setTextColor(Color.BLACK);
                  panel.addView(heading);

                  result = new TextView(this);
                  result.setTextSize(18);
                  result.setTextColor(Color.BLACK);
                  result.setPadding(0, dp(14), 0, dp(14));
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(result);
                  panel.addView(scroll, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));

                  Button close = new Button(this);
                  close.setText("बंद करें");
                  close.setOnClickListener(v -> closePanel());
                  panel.addView(close);

                  Button stop = new Button(this);
                  stop.setText("अनुवाद बटन पूरी तरह बंद करें");
                  stop.setOnClickListener(v -> disableSelf());
                  panel.addView(stop);

                  int width = getResources().getDisplayMetrics().widthPixels - dp(32);
                  int height = Math.min(dp(520),
                      getResources().getDisplayMetrics().heightPixels - dp(100));
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                      width, height,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  p.gravity = Gravity.CENTER;
                  wm.addView(panel, p);
              }

              private void closePanel() {
                  ++request;
                  if (panel != null) {
                      wm.removeView(panel);
                      panel = null;
                      result = null;
                  }
                  if (bubble != null) bubble.setVisibility(View.VISIBLE);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // No background text collection.
              }

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  ++request;
                  if (wm != null && panel != null) wm.removeView(panel);
                  if (wm != null && bubble != null) wm.removeView(bubble);
                  panel = null;
                  bubble = null;
                  if (translator != null) translator.close();
                  if (identifier != null) identifier.close();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hindi-Translator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
